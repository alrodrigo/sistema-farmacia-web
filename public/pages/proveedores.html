
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores - Sistema Farmacia</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Sistema de Diseño Base -->
    <link rel="stylesheet" href="../css/theme.css?v=4.0.1788985130">
    <link rel="stylesheet" href="../css/components.css?v=4.0.1788985130">
    <link rel="stylesheet" href="../css/layout.css?v=4.0.1788985130">

    <link rel="stylesheet" href="../css/proveedores.css?v=4.0.1788985130">

    <!-- Responsive (DEBE IR AL FINAL) -->
    <link rel="stylesheet" href="../css/responsive.css?v=4.0.1788985130">
</head>

<body>
    <!-- ==================== NAVBAR SUPERIOR (Inyectado por LayoutUI) ==================== -->
    <div id="navbar-container"></div>

    <!-- ==================== CONTENEDOR PRINCIPAL ==================== -->
    <div class="main-container">

        <!-- ==================== SIDEBAR (Inyectado por LayoutUI) ==================== -->
        <div id="sidebar-container"></div>

        <!-- ==================== CONTENIDO PRINCIPAL ==================== -->
        <main class="content">
            <!-- Encabezado -->
            <div class="content-header">
                <div>
                    <h1><i class="fas fa-truck"></i> Proveedores</h1>
                    <p>Gestiona los proveedores y laboratorios</p>
                </div>
                <button class="btn btn-primary" onclick="abrirModalNuevo()">
                    <i class="fas fa-plus"></i> Nuevo Proveedor
                </button>
            </div>

            <!-- Estadísticas -->
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-icon" style="background: var(--primary-color)">
                        <i class="fas fa-truck"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="totalProveedores">0</h3>
                        <p>Total Proveedores</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: var(--success-color)">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="proveedoresActivos">0</h3>
                        <p>Activos</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: var(--info-color)">
                        <i class="fas fa-boxes"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="productosAsociados">0</h3>
                        <p>Productos Asociados</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: var(--warning-color)">
                        <i class="fas fa-globe"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="paisesUnicos">0</h3>
                        <p>Países</p>
                    </div>
                </div>
            </div>

            <!-- Barra de búsqueda y filtros -->
            <div class="filters-section">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Buscar proveedor...">
                </div>
                <div class="filter-group">
                    <select id="filtroEstado" class="filter-select">
                        <option value="todos">Todos los estados</option>
                        <option value="activo">Activos</option>
                        <option value="inactivo">Inactivos</option>
                    </select>
                    <select id="filtroPais" class="filter-select">
                        <option value="todos">Todos los países</option>
                    </select>
                </div>
            </div>

            <!-- Grid de proveedores -->
            <div id="proveedoresGrid" class="proveedores-grid">
                <!-- Se llena dinámicamente con JavaScript -->
            </div>

            <!-- Estado vacío -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <i class="fas fa-truck"></i>
                <h3>No hay proveedores registrados</h3>
                <p>Comienza agregando tu primer proveedor</p>
                <button class="btn btn-primary" onclick="abrirModalNuevo()">
                    <i class="fas fa-plus"></i> Nuevo Proveedor
                </button>
            </div>
        </main>
    </div>

    <!-- ==================== MODAL PROVEEDOR ==================== -->
    <div id="modalProveedor" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle"><i class="fas fa-truck"></i> Nuevo Proveedor</h2>
                <button class="modal-close" onclick="cerrarModal()">&times;</button>
            </div>
            <form id="formProveedor">
                <div class="modal-body">
                    <input type="hidden" id="proveedorId">

                    <div class="form-row">
                        <div class="form-group">
                            <label for="inputNombre">
                                <i class="fas fa-building"></i> Nombre del Proveedor *
                            </label>
                            <input type="text" id="inputNombre" required placeholder="Ej: Bayer">
                        </div>
                        <div class="form-group">
                            <label for="inputPais">
                                <i class="fas fa-globe"></i> País
                            </label>
                            <input type="text" id="inputPais" placeholder="Ej: Alemania">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="inputTelefono">
                                <i class="fas fa-phone"></i> Teléfono
                            </label>
                            <input type="tel" id="inputTelefono" placeholder="Ej: +49 30 1234567">
                        </div>
                        <div class="form-group">
                            <label for="inputEmail">
                                <i class="fas fa-envelope"></i> Email
                            </label>
                            <input type="email" id="inputEmail" placeholder="Ej: contacto@bayer.com">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="inputDireccion">
                            <i class="fas fa-map-marker-alt"></i> Dirección
                        </label>
                        <textarea id="inputDireccion" rows="2" placeholder="Dirección completa"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="inputSitioWeb">
                            <i class="fas fa-link"></i> Sitio Web
                        </label>
                        <input type="url" id="inputSitioWeb" placeholder="https://www.ejemplo.com">
                    </div>

                    <div class="form-group">
                        <label for="inputNotas">
                            <i class="fas fa-sticky-note"></i> Notas
                        </label>
                        <textarea id="inputNotas" rows="3" placeholder="Información adicional..."></textarea>
                    </div>

                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="inputActivo" checked>
                            <span>Proveedor activo</span>
                        </label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="cerrarModal()">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary" id="btnGuardar">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Configuración de Firebase -->
    <script src="../js/config/firebase.js?v=4.0.1788985130"></script>

    <!-- Utilidades -->
    <script src="../js/utils/helpers.js?v=4.0.1788985130"></script>
    <script src="../js/utils/roles.js?v=4.0.1788985130"></script>

    <!-- Script principal -->
    <script type="module" src="../js/controllers/proveedores.js?v=4.0.1788985130"></script>

    <!-- Service Worker para actualización automática -->
    <script src="../js/sw-register.js?v=4.0.1788985130"></script>
</body>

</html>
